name: 14 - Working with Artifacts

on: 
    workflow_dispatch:


env:
    build-artifact-key: app-${{github.sha}}
    test-coverage-key: test-coverage-${{github.sha}}
jobs:
    test-build:
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: 14-artifacts/react-app # This directory is only for run paths
        steps: 
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v3
              with: 
                node-version: '20.x'
            - name: Download cached dependencies
              uses: actions/cache@v3
              id: cache
              with: 
                path: 14-artifacts/react-app/node_modules
                key: deps-node-modules-${{ hashFiles('14-artifacts/react-app/package-lock.json')}}
            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
            - name: Unit Test
              run: npm run test -- --coverage
            - name: Upload Test Results
              uses: actions/upload-artifact@v4
              with:
                # name: test-coverage
                name: ${{env.test-coverage-key}}
                path: 14-artifacts/react-app/coverage
            - name: Build Code
              run: npm run build
            - name: Upload Build Files
              uses: actions/upload-artifact@v4
              with:
                # name: app
                name: ${{env.build-artifact-key}}
                path: 14-artifacts/react-app/build
    deploy: 
        runs-on: ubuntu-latest
        needs: test-build
        steps:
          - name: Download build artifact
            uses: actions/download-artifact@v4
            with: 
              # name: app # This needs to match the name of the artifact
              name: ${{env.build-artifact-key}}
              path: build
          - name: Show folder structure
            run: ls -R


